name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Windows / Python ${{ matrix.python-version }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime and test dependencies without downloading a model
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Import runtime dependency surface
        run: python -c "import faster_whisper, keyboard, numpy, PIL, pyperclip, pystray, sounddevice; print('runtime imports ok')"

      - name: Run synthetic non-live suite
        run: python -m pytest -m "not live" --strict-markers -q

      - name: Verify package metadata and privacy-safe config command
        run: |
          python -m voxpress --version
          python -m voxpress --check-config

  lint:
    name: Ruff (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  package:
    name: Build wheel and source distribution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install wheel without runtime dependencies and import
        shell: pwsh
        run: |
          $wheel = Get-ChildItem -LiteralPath dist -Filter "*.whl" | Select-Object -First 1
          if (-not $wheel) { throw "wheel not produced" }
          python -m pip install --no-deps --force-reinstall $wheel.FullName
          python -c "import voxpress; assert voxpress.__version__ == '0.2.0'"

      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

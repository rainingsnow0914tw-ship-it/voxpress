[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxpress"
version = "0.1.0"
description = "Press a hotkey, talk, paste. A tiny Windows tray tool that turns your voice into text anywhere using local Whisper."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "VoxPress contributors"},
]
keywords = ["whisper", "speech-to-text", "stt", "dictation", "tray", "windows", "hotkey", "voice-typing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "faster-whisper>=1.0",
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "keyboard>=0.13.5",
    "pyperclip>=1.8.2",
    "pystray>=0.19.5",
    "pillow>=10.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]
dev = [
    "pyinstaller>=6.0",
    "ruff",
]

[project.scripts]
voxpress = "voxpress.__main__:main"

[project.urls]
Homepage = "https://github.com/rainingsnow0914tw-ship-it/voxpress"
Repository = "https://github.com/rainingsnow0914tw-ship-it/voxpress"
Issues = "https://github.com/rainingsnow0914tw-ship-it/voxpress/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voxpress = ["*.ico", "*.png"]
